name: TRIAL

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 * * * *'

jobs:
  fake-downloads:
    runs-on: windows-latest
    steps:
        - name: Hit the download URL repeatedly (PowerShell)
          shell: pwsh 
          run: |
              $URL = "https://github.com/npmaiecosystem/NPM-AutoCode-AI/releases/download/v4.0.0/NPM-AutoCode-AI-windows.zip"
          
             
              1..500 | ForEach-Object {
              Invoke-WebRequest -Uri $URL -OutFile NUL -UseBasicParsing
              Start-Sleep -Seconds 1
              }
